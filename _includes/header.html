<header class="site-head">
  <div class="wrap site-head__inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.author.name }} — home">
      <svg class="brand__hud" viewBox="0 0 20 16" aria-hidden="true">
        <path class="brand__hud-chevron" d="M3 4 L9 8 L3 12" />
        <line class="brand__hud-cursor" x1="14" y1="4" x2="14" y2="12" />
      </svg>
      <span class="brand__tip" aria-hidden="true">Home</span>
    </a>

    <nav class="nav" aria-label="Primary">
      {%- assign p = page.url -%}
      <a href="{{ '/work/'      | relative_url }}" data-nav="work"      {% if p contains '/work' %}aria-current="page"{% endif %}>Work</a>
      <a href="{{ '/writing/'   | relative_url }}" data-nav="writing"   {% if p contains '/writing' %}aria-current="page"{% endif %}>Writing</a>
      <a href="{{ '/cv/'        | relative_url }}" data-nav="cv"        {% if p contains '/cv' %}aria-current="page"{% endif %}>CV</a>
      <a href="{{ '/interests/' | relative_url }}" data-nav="interests" {% if p contains '/interests' %}aria-current="page"{% endif %}>Interests</a>
      <a href="{{ '/status/'    | relative_url }}" data-nav="status"    {% if p contains '/status' %}aria-current="page"{% endif %}>Status</a>
    </nav>
  </div>
</header>

{%- assign latest_status = site.data.status.first -%}
{%- if latest_status -%}
<div class="status-strip">
  <div class="wrap status-strip__inner">
    <div class="status-strip__body">
      <span class="status-strip__label">
        <span class="status-strip__dot" aria-hidden="true"></span>
        Status · {{ latest_status.date | date: "%b %-d" }}
      </span>
      <p class="status-strip__text">{{ latest_status.text }}</p>
    </div>
    <a class="status-strip__link" href="{{ '/status/' | relative_url }}">History →</a>
  </div>
</div>
{%- endif -%}
