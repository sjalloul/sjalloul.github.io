<script>
(function () {
  var sections = document.querySelectorAll('[data-nav-section]');
  var navLinks = document.querySelectorAll('.nav a[data-nav]');
  if (!sections.length || !navLinks.length || typeof IntersectionObserver === 'undefined') return;

  var map = {};
  navLinks.forEach(function (a) { map[a.getAttribute('data-nav')] = a; });

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      var link = map[entry.target.getAttribute('data-nav-section')];
      if (!link) return;
      if (entry.isIntersecting) {
        navLinks.forEach(function (a) { a.classList.remove('is-inview'); });
        link.classList.add('is-inview');
      }
    });
  }, { root: null, rootMargin: '-45% 0px -45% 0px', threshold: 0 });

  sections.forEach(function (s) { io.observe(s); });
})();

(function () {
  var cue = document.getElementById('scroll-cue');
  if (!cue) return;
  var hidden = false;
  function onScroll() {
    var shouldHide = window.scrollY > 80;
    if (shouldHide !== hidden) {
      hidden = shouldHide;
      cue.classList.toggle('is-hidden', hidden);
    }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
})();
</script>
