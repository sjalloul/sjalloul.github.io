- kind: "Music"
  title: "French-Arabic house"
  note: >
    Somewhere between a Marseille basement and a Cairo rooftop. The rhythmic overlap of
    two traditions is a whole education in structure.

- kind: "Motorsport"
  title: "Circuit to showroom"
  note: >
    Formula 1 and the 24 Hours of Le Mans as the same engineering argument, run two
    different ways. No brand has closed the loop between track and production line
    quite like Audi — race-bred diesel, hybrid, and quattro technology, run straight
    into the cars people actually drive.

- kind: "Football"
  title: "World Cup history"
  note: >
    Tournaments as social history. The tactics change, but the stories about who we are
    stay remarkably constant.

- kind: "Language"
  title: "Arabic"
  note: >
    Keeping the language close — its precision and its poetry, and everything that gets
    lost and found in translation.

- kind: "Restoration"
  title: "Bringing an 1891 Queen Anne back to life"
  image: "queen-anne-sketch.png"
  note: >
    A labor of love since 2018 — original woodwork, wraparound porch, turret and all.
    A different kind of systems work: load paths instead of data paths, but the same
    satisfaction when the thing finally holds.
