---
layout: default
---
<article class="wrap section">
  <header class="section__head">
    {% if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif %}
    <h1 class="section__title">{{ page.title }}</h1>
    {% if page.subtitle %}<p>{{ page.subtitle }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
